[workspace]
members = ["macros"]

[package]
name = "nostr-ln"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The service side of NNC (NIP-XX) and NWC (NIP-47): grants, limits, and the request pipeline."
repository = "https://github.com/DarkWebDivingClub/nostr-ln"
publish = false

[dependencies]
nostr = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2", default-features = false, features = ["std", "nip44", "os-rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

nostr-sdk = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2", optional = true }
tokio = { version = "1", features = ["time", "macros"], optional = true }

[features]
default = []
# The NNC client. Off by default so a consumer wanting only the types and
# the access layer does not pull a relay stack.
client = ["dep:nostr-sdk", "dep:tokio"]

[dev-dependencies]
serde_json = "1"
