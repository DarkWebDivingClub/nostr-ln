[workspace]
members = ["macros"]

[package]
name = "nostr-ln"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The service side of NNC (NIP-XX) and NWC (NIP-47): grants, limits, and the request pipeline."
repository = "https://github.com/DarkWebDivingClub/nostr-ln"
publish = false

[dependencies]
nostr = { git = "https://github.com/dukeh3/nostr.git", rev = "9ac9adc2", default-features = false, features = ["std", "nip44", "os-rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
